<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina niet gevonden | Energie met Bart</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" href="images/favicon.ico">
<style>
  :root {
    --navy: #10233a; --navy-light: #1c3b5c; --amber: #a04f28; --amber-light: #b45f31;
    --bg: #f7f5f1; --white: #ffffff; --text: #22303f; --muted: #5b6b7a; --border: #e4ded3;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  a { text-decoration: none; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }
  header { padding: 24px 0; }
  .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; color: var(--navy); }
  .logo span { color: var(--amber); }
  main { min-height: 60vh; display: flex; align-items: center; }
  .code { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); margin-bottom: 10px; }
  h1 { font-size: 2rem; color: var(--navy); margin: 0 0 14px; letter-spacing: -0.01em; }
  p { color: var(--muted); font-size: 1.05rem; margin: 0 0 28px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; padding: 13px 24px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; }
  .btn-primary { background: var(--amber); color: #fff; }
  .btn-ghost { background: var(--white); color: var(--navy); border: 1px solid var(--border); }
</style>
</head>
<body>
<header><div class="wrap"><a href="/" class="logo">Energie met <span>Bart</span></a></div></header>
<main>
  <div class="wrap">
    <div class="code">Foutcode 404</div>
    <h1>Deze pagina bestaat niet (meer)</h1>
    <p>De link die u volgde klopt niet, of de pagina is verplaatst. Ga terug naar de homepage,
       of kies direct een van de belangrijkste pagina&rsquo;s.</p>
    <div class="links">
      <a href="/" class="btn btn-primary">Naar de homepage</a>
      <a href="/diensten" class="btn btn-ghost">Diensten</a>
      <a href="/#contact" class="btn btn-ghost">Contact</a>
    </div>
  </div>
</main>
</body>
</html>
